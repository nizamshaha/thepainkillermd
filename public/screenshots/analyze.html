<!DOCTYPE html><html><head><title>Image Analysis</title></head><body><h1>Image Analysis</h1><div id="output"></div><script>var imgs = document.querySelectorAll("img");var output = document.getElementById("output");for (var i = 0; i < imgs.length; i++) {  var img = imgs[i];  var canvas = document.createElement("canvas");  canvas.width = img.naturalWidth;  canvas.height = img.naturalHeight;  var ctx = canvas.getContext("2d");  ctx.drawImage(img, 0, 0);  var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;  var div = document.createElement("div");  div.innerHTML = "<h2>Image " + (i+1) + " (" + img.naturalWidth + "x" + img.naturalHeight + ")</h2>";  div.innerHTML += "<p>Top color: rgb(" + data[0] + "," + data[1] + "," + data[2] + ")</p>";  var midY = Math.floor(canvas.height/2);  var midIdx = (midY * canvas.width + Math.floor(canvas.width/2)) * 4;  div.innerHTML += "<p>Mid color: rgb(" + data[midIdx] + "," + data[midIdx+1] + "," + data[midIdx+2] + ")</p>";  var botIdx = ((canvas.height-1) * canvas.width + Math.floor(canvas.width/2)) * 4;  div.innerHTML += "<p>Bot color: rgb(" + data[botIdx] + "," + data[botIdx+1] + "," + data[botIdx+2] + ")</p>";  output.appendChild(div);}</script></body></html>
